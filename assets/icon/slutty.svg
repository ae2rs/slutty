<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: an 824 tile on a 1024 canvas, corner radius 185.4. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24283b"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#night)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184.4" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
  <polyline points="385,380 525,512 385,644" fill="none" stroke="url(#prompt)" stroke-width="64"
    stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="615" y="372" width="56" height="280" rx="14" fill="#f7768e"/>
</svg>
