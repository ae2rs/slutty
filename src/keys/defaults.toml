# slutty's built-in bindings: the WezTerm setup they replace. A config file
# adds to them under [keys.bind], removes one with "none", or drops them all
# with `defaults = false`.

[bind]
"cmd+q" = "quit"
"cmd+n" = "new-window"
"ctrl+shift+n" = "new-window"
"leader m" = "pop-pane"
"leader M" = "pop-tab"
"cmd+v" = "paste"
"ctrl+shift+v" = "paste"
"cmd+c" = "copy"
"ctrl+shift+c" = "copy"
"cmd+f" = "search"
"ctrl+shift+f" = "search"
"leader c" = "copy-mode"
"ctrl+shift+x" = "copy-mode"
"leader space" = "quick-select"
"leader o" = "open-url"
"cmd+o" = "open-url"

"cmd+-" = "decrease-font-size"
"ctrl+-" = "decrease-font-size"
"cmd+=" = "increase-font-size"
"ctrl+=" = "increase-font-size"
"cmd+0" = "reset-font-size"
"ctrl+0" = "reset-font-size"

"leader t" = "new-tab"
"cmd+t" = "new-tab"
"ctrl+shift+t" = "new-tab"
"cmd+w" = { action = "close-tab", confirm = true }
"ctrl+shift+w" = { action = "close-tab", confirm = true }
"leader 1" = { action = "activate-tab", index = 1 }
"leader 2" = { action = "activate-tab", index = 2 }
"leader 3" = { action = "activate-tab", index = 3 }
"leader 4" = { action = "activate-tab", index = 4 }
"leader 5" = { action = "activate-tab", index = 5 }
"leader 6" = { action = "activate-tab", index = 6 }
"leader 7" = { action = "activate-tab", index = 7 }
"leader 8" = { action = "activate-tab", index = 8 }
"leader 9" = { action = "activate-tab", index = 9 }
"leader 0" = { action = "activate-tab", index = -1 }
"cmd+1" = { action = "activate-tab", index = 1 }
"cmd+2" = { action = "activate-tab", index = 2 }
"cmd+3" = { action = "activate-tab", index = 3 }
"cmd+4" = { action = "activate-tab", index = 4 }
"cmd+5" = { action = "activate-tab", index = 5 }
"cmd+6" = { action = "activate-tab", index = 6 }
"cmd+7" = { action = "activate-tab", index = 7 }
"cmd+8" = { action = "activate-tab", index = 8 }
"cmd+9" = { action = "activate-tab", index = 9 }
"leader Z" = "toggle-tab-bar"
"cmd+Z" = "toggle-tab-bar"

"leader v" = "split-right"
"leader -" = "split-down"
"leader x" = { action = "close-pane", confirm = true }
"leader h" = { action = "focus-pane", direction = "left" }
"leader j" = { action = "focus-pane", direction = "down" }
"leader k" = { action = "focus-pane", direction = "up" }
"leader l" = { action = "focus-pane", direction = "right" }
"cmd+h" = { action = "focus-pane", direction = "left" }
"cmd+j" = { action = "focus-pane", direction = "down" }
"cmd+k" = { action = "focus-pane", direction = "up" }
"cmd+l" = { action = "focus-pane", direction = "right" }
"leader H" = { action = "resize-pane", direction = "left", cells = 5 }
"leader J" = { action = "resize-pane", direction = "down", cells = 5 }
"leader K" = { action = "resize-pane", direction = "up", cells = 5 }
"leader L" = { action = "resize-pane", direction = "right", cells = 5 }
"leader r" = { action = "key-table", name = "resize", sticky = true }
"cmd+r" = { action = "key-table", name = "resize", sticky = true }
"leader z" = "toggle-zoom"
"cmd+z" = "toggle-zoom"
"leader e" = "rotate-panes"
"cmd+e" = "rotate-panes"
"leader p" = "pane-select"
"cmd+p" = "pane-select"

"leader f" = "toggle-floating"
"leader F" = "new-floating"
"leader tab" = "cycle-floating"
"leader w" = { action = "key-table", name = "float", sticky = true }

"leader R" = "reload-config"
"cmd+R" = "reload-config"
"alt+enter" = "toggle-fullscreen"

# macOS-style line editing for shells.
"cmd+left" = { action = "send", text = "\u001bOH" }
"cmd+right" = { action = "send", text = "\u001bOF" }
"opt+left" = { action = "send", text = "\u001bb" }
"opt+right" = { action = "send", text = "\u001bf" }
"cmd+backspace" = { action = "send-key", key = "ctrl+u" }

# Resize the active pane a cell at a time until escape.
[tables.resize]
"h" = { action = "resize-pane", direction = "left" }
"j" = { action = "resize-pane", direction = "down" }
"k" = { action = "resize-pane", direction = "up" }
"l" = { action = "resize-pane", direction = "right" }
"left" = { action = "resize-pane", direction = "left" }
"down" = { action = "resize-pane", direction = "down" }
"up" = { action = "resize-pane", direction = "up" }
"right" = { action = "resize-pane", direction = "right" }
"escape" = "pop-table"
"enter" = "pop-table"
"ctrl+c" = "pop-table"

# Move the active floating pane a cell at a time, resize it with shift, or
# put it at an anchor laid out as on a numpad, until escape.
[tables.float]
"h" = { action = "move-pane", direction = "left" }
"j" = { action = "move-pane", direction = "down" }
"k" = { action = "move-pane", direction = "up" }
"l" = { action = "move-pane", direction = "right" }
"left" = { action = "move-pane", direction = "left" }
"down" = { action = "move-pane", direction = "down" }
"up" = { action = "move-pane", direction = "up" }
"right" = { action = "move-pane", direction = "right" }
"H" = { action = "resize-pane", direction = "left" }
"J" = { action = "resize-pane", direction = "down" }
"K" = { action = "resize-pane", direction = "up" }
"L" = { action = "resize-pane", direction = "right" }
"7" = { action = "anchor-pane", anchor = "top-left" }
"8" = { action = "anchor-pane", anchor = "top" }
"9" = { action = "anchor-pane", anchor = "top-right" }
"4" = { action = "anchor-pane", anchor = "left" }
"5" = { action = "anchor-pane", anchor = "center" }
"6" = { action = "anchor-pane", anchor = "right" }
"1" = { action = "anchor-pane", anchor = "bottom-left" }
"2" = { action = "anchor-pane", anchor = "bottom" }
"3" = { action = "anchor-pane", anchor = "bottom-right" }
"escape" = "pop-table"
"enter" = "pop-table"
"ctrl+c" = "pop-table"
