[package]
name = "slutty"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A fast, native macOS terminal emulator and multiplexer built on libghostty"
repository = "https://github.com/ae2rs/slutty"
readme = "README.md"
keywords = ["terminal", "terminal-emulator", "multiplexer", "macos", "ghostty"]
categories = ["command-line-utilities", "gui", "os::macos-apis"]
rust-version = "1.96"
include = ["/src", "/assets/fonts", "/LICENSE-APACHE", "/LICENSE-MIT", "/README.md"]

[dependencies]
# libghostty-vt 1.0.1. crates.io only has pre-1.0 releases of the bindings.
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "483ea3d5247b214060da58ef6037a95f30ae89fb" }
libc = "0.2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
objc2-user-notifications = "0.3.2"
